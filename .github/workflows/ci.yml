name: CI

# Runs the baseline checks from docs/TESTING.md on the checked lane only:
# CPython 3.12.15 and Node 24.21.0 on GitHub-hosted Linux x86-64 runners.
# Other platform lanes are not part of this workflow; see
# docs/DEPENDENCY-STRATEGY.md "Platform and accelerator lanes".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer run for the same pull request cancels the older one. Every other
  # run (a push to main, a manual dispatch) gets its own group, so none is
  # cancelled or dropped from the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend / CPython 3.12.15 / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          enable-cache: false
      - name: Install the hashed backend lock
        run: |
          uv venv --managed-python --python 3.12.15
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: backend/locks/cp312-linux-x86_64.txt
          uv pip check --python .venv/bin/python
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Record the interpreter
        run: |
          python -VV
          python -c 'import sqlite3, sys; print(sys.executable); print("SQLite", sqlite3.sqlite_version)'
          test "$(python -c 'import platform; print(platform.python_version())')" = 3.12.15
      - name: Django check, tests, and migration drift
        working-directory: backend
        run: |
          python manage.py check
          python manage.py test core agent 2>&1 | tee "$RUNNER_TEMP/django-tests.log"
          # Django exits 0 when no test is collected; require a nonzero count.
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/django-tests.log" || { echo '::error::Django ran no tests'; exit 1; }
          python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend / Node 24 / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm 11.21.0 and the locked dependencies
        run: |
          npm install --global npm@11.21.0
          node --version
          test "$(npm --version)" = 11.21.0
          npm ci
      - name: Lint, type-check, and build
        run: |
          npm run lint
          npx next typegen
          npx tsc --noEmit
          npm run build

  e2e:
    # Both server modes run: only next dev can serve /_next/mcp, so only the
    # dev run checks that experimental.mcpServer stays disabled.
    name: E2E / Playwright Chromium / ${{ matrix.server }} Next
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server: [production, dev]
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          enable-cache: false
      - name: Install the hashed backend lock for the Playwright web server
        working-directory: .
        run: |
          uv venv --managed-python --python 3.12.15
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: backend/locks/cp312-linux-x86_64.txt
          uv pip check --python .venv/bin/python
          # playwright.config.ts starts the backend with `python`.
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm 11.21.0, the locked dependencies, and the paired Chromium
        run: |
          npm install --global npm@11.21.0
          test "$(npm --version)" = 11.21.0
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright against a fresh ${{ matrix.server }} server
        env:
          CI: '1'
          PLAYWRIGHT_NEXT_SERVER: ${{ matrix.server }}
        run: npm run test:visual
      - name: Upload screenshots and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.server }}-attempt-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  backend-pytest:
    # The backend job's Django tests, run by pytest from the hashed test lock.
    # A separate job leaves the backend job and its check unchanged.
    name: Backend / pytest / CPython 3.12.15 / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # uv ignores uv.toml and pyproject.toml files, which a pull request could add.
      UV_NO_CONFIG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          enable-cache: false
          # With a Python version given, setup-uv does not look for an interpreter in the checkout and run it.
          python-version: '3.12.15'
      - name: Install the hashed backend test lock
        run: |
          uv venv --managed-python --python 3.12.15
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: backend/locks/cp312-linux-x86_64-test.txt
          uv pip check --python .venv/bin/python
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      # The lock check runs before any step that runs Python from the checkout, which could
      # otherwise change the environment it reads.
      - name: Check the test lock against the backend lock and both inputs
        # -I keeps files in scripts/ci/ or the checkout root from standing in for installed packages.
        run: python -I scripts/ci/check_test_lock.py backend/locks/cp312-linux-x86_64.txt backend/locks/cp312-linux-x86_64-test.txt backend/requirements.txt backend/requirements-test.txt
      - name: Test the lock check against changed locks and inputs
        # Run directly, not through unittest discover, so scripts/ci/tests/ is not on the import path either.
        run: python -I scripts/ci/tests/test_check_test_lock.py --verbose
      - name: Record the interpreter and pytest
        run: |
          python -VV
          python -m pytest --version
          test "$(python -c 'import platform; print(platform.python_version())')" = 3.12.15
      - name: Check that pytest and Django collect the same tests
        working-directory: backend
        run: python ../scripts/ci/check_test_parity.py
      - name: Run the backend tests with pytest
        working-directory: backend
        # pytest exits 5 when it collects no test, so an empty run fails.
        run: python -m pytest

  frontend-unit:
    name: Frontend / Vitest / Node 24 / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm 11.21.0 and the locked dependencies
        run: |
          npm install --global npm@11.21.0
          node --version
          test "$(npm --version)" = 11.21.0
          npm ci
      - name: Run the unit tests
        # vitest run exits 1 when it finds no test file, so an empty run fails.
        run: npm run test:unit

  compatibility:
    # The compatibility model in docs/CI-MATRIX.md: the validator's own tests, the committed
    # profile, and a record of this runner checked against that profile. A pass shows that
    # this tooling works on this runner; it is not a support claim for any other platform.
    name: Compatibility / Schema & Probe / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # uv ignores uv.toml and pyproject.toml files, which a pull request could add.
      UV_NO_CONFIG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          enable-cache: false
          # With a Python version given, setup-uv does not look for an interpreter in the checkout and run it.
          python-version: '3.12.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Create a CPython 3.12.15 environment with no packages
        # The scripts use the standard library only, so nothing is installed into it.
        run: |
          uv venv --managed-python --python 3.12.15
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Record this runner's environment
        # Reads /proc, /sys and allowlisted variables only; never escalates privileges.
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility"
          python -I scripts/ci/collect_environment.py --profile-id linux-x64-gha --output "$RUNNER_TEMP/compatibility/linux-x64-gha.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Check the record and the committed profile
        run: python -I scripts/ci/validate_compatibility.py --require-real --dependency-strategy docs/DEPENDENCY-STRATEGY.md --profile tests/compatibility/profiles/linux-x64-gha.json --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/compatibility/linux-x64-gha.json" tests/compatibility/profiles/*.json
      - name: Test the validator and the probe, including records that must fail
        if: ${{ !cancelled() }}
        # Run directly, not through unittest discover, so scripts/ci/tests/ is not on the import path.
        run: |
          python -I scripts/ci/tests/test_compatibility_schema.py --verbose
          python -I scripts/ci/tests/test_environment_probe.py --verbose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: compatibility-linux-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compatibility/
          if-no-files-found: warn
          retention-days: 7
