# pytest runs the same Django test suite as `python manage.py test core agent`.
# Run it from backend/; scripts/ci/check_test_parity.py checks that both
# runners collect the same tests.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = core agent
# Django's DiscoverRunner pattern; pytest's default skips tests.py.
python_files = test*.py
addopts = --strict-markers --strict-config -ra
